services:
  - type: web
    runtime: python
    name: campusmate-api
    plan: free
    region: singapore
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync python src/main.py -m http -p $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_TEST_MODE
        value: "false"
      - key: ENABLE_AGENT_RUNTIME
        value: "false"
      - key: BOOTSTRAP_OPERATOR_EMAIL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: CAMPUS_EMAIL_DOMAINS
        value: nju.edu.cn,smail.nju.edu.cn
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  - type: web
    runtime: static
    name: campusmate-web
    buildCommand: npm --prefix apps/web ci && npm --prefix apps/web run build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
