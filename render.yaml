services:
  - type: web
    runtime: python
    name: campusmate-api
    plan: free
    region: singapore
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync alembic upgrade head && uv run --no-sync python src/main.py -m http -p $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "86400"
      - key: ABUSE_HASH_SECRET
        generateValue: true
      - key: AUTH_TEST_MODE
        value: "false"
      - key: ENABLE_AGENT_RUNTIME
        value: "false"
      - key: BOOTSTRAP_OPERATOR_EMAIL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: CAMPUS_EMAIL_DOMAINS
        value: nju.edu.cn,smail.nju.edu.cn
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: CampusMate
      - key: COZE_DEPLOY_API_TOKEN
        sync: false
      - key: COZE_POST_DRAFT_API_URL
        sync: false
      - key: COZE_CLASSIFY_REVIEW_API_URL
        sync: false
      - key: COZE_MATCH_API_URL
        sync: false
      - key: COZE_TEAM_PLAN_API_URL
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  - type: web
    runtime: static
    name: campusmate-web
    buildCommand: npm --prefix apps/web ci && npm --prefix apps/web run build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
